name: Android APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'manifest.json', 'icons/**', 'vendor/**', 'android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'app.js', 'manifest.json', 'icons/**', 'vendor/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Ubuntu runner ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.

      # Fingerprint of what the APK bundles apart from the silently updated web files (see Ota.java).
      # The app only offers an APK update when the newest release's fingerprint differs from its own.
      - name: Fingerprint the Android part
        run: echo "NATIVE_HASH=$(git ls-files -s android icons manifest.json vendor | sha1sum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../tilstandsrapport.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tilstandsrapport-apk
          path: tilstandsrapport.apk

      # Each build on main becomes a GitHub Release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/tilstandsrapport.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same number as versionCode in android/app/build.gradle (run number + 10).
          build=$(( ${{ github.run_number }} + 10 ))
          gh release create "v1.0.$build" tilstandsrapport.apk \
            --title "Tilstandsrapport 1.0.$build" \
            --notes "Android build of commit ${{ github.sha }}. Download tilstandsrapport.apk below and open it on your phone to install or update. native: ${{ env.NATIVE_HASH }}"
