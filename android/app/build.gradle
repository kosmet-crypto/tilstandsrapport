plugins {
    id 'com.android.application'
}

// The web app lives at the repo root; copy it into the APK so it works offline.
def webRoot = rootProject.file('..')
tasks.register('copyWebApp', Copy) {
    from(webRoot) {
        include 'index.html', 'app.js', 'manifest.json', 'icons/**', 'vendor/**'
    }
    into 'src/main/assets/www'
}
preBuild.dependsOn copyWebApp

android {
    namespace 'app.tilstandsrapport'
    compileSdk 35

    defaultConfig {
        applicationId 'app.tilstandsrapport'
        minSdk 26
        targetSdk 34  // 35 forces edge-to-edge; the page does not pad for system bars in a WebView
        // CI passes the run number so each new APK installs over the previous one.
        // +10: the repo was recreated and run numbers restarted; stay above the old builds (up to 1.0.3).
        def build = ((System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int) + 10
        versionCode build
        versionName "1.0.${build}"
        // Where the app looks for newer APKs (GitHub Releases of this repo).
        // Commit of the bundled web app, and a fingerprint of the rest of the APK (see Ota and the workflow).
        buildConfigField 'String', 'WEB_SHA', "\"${System.getenv('GITHUB_SHA') ?: ''}\""
        buildConfigField 'String', 'NATIVE_HASH', "\"${System.getenv('NATIVE_HASH') ?: ''}\""
        buildConfigField 'String', 'UPDATE_REPO', "\"${System.getenv('GITHUB_REPOSITORY') ?: 'kosmet-crypto/tilstandsrapport'}\""
    }

    signingConfigs {
        // Fixed key committed to the repo so every build can update the installed app.
        // Fine for sideloading; use a private key (GitHub secret) before publishing to Google Play.
        release {
            storeFile file('tilstand.keystore')
            storePassword 'tilstand'
            keyAlias 'tilstand'
            keyPassword 'tilstand'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
